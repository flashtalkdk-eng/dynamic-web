<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<!--
  Nothing on this page is static. On every reload the script regenerates:
  tag names, ids, names, classes, data-* / aria attributes, iframe ids/names/titles,
  labels, placeholders, button text, error messages, dropdown / radio options,
  which optional fields exist, field order, label position, iframe count and nesting,
  colours, fonts, spacing and the page title.
  Controls live inside CLOSED shadow roots, so XPath / CSS cannot reach them.
-->
</head>
<body>
<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   *  CONFIG
   * ------------------------------------------------------------------ */
  const CONFIG = {
    ROTATE_MS: 0,          // >0 : also re-randomise attributes AND all text every N ms (e.g. 4000)
    TEXT_MODE: 'readable'  // 'readable' : generated wording + homoglyph/zero-width noise
                           // 'gibberish': labels/placeholders are pure random words
                           //              (the real meaning is only in a hover tooltip)
  };

  /* ------------------------------------------------------------------ *
   *  Random helpers
   * ------------------------------------------------------------------ */
  const R = {
    int: (a, b) => Math.floor(Math.random() * (b - a + 1)) + a,
    pick: (a) => a[Math.floor(Math.random() * a.length)],
    chance: (p) => Math.random() < p,
    shuffle: (a) => {
      a = a.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = R.int(0, i);
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },
    str: (n) => {
      n = n || 8;
      const L = 'abcdefghijklmnopqrstuvwxyz', A = L + '0123456789';
      let s = L[R.int(0, 25)];
      for (let i = 1; i < n; i++) s += A[R.int(0, A.length - 1)];
      return s;
    }
  };

  /* ------------------------------------------------------------------ *
   *  Text engine: casing + homoglyphs + zero-width characters
   * ------------------------------------------------------------------ */
  const ZW = ['\u200b', '\u200c', '\u2060'];
  // Latin letters swapped for look-alike Cyrillic letters (same look, different text)
  const HG = {
    a: '\u0430', e: '\u0435', o: '\u043e', p: '\u0440', c: '\u0441', x: '\u0445',
    y: '\u0443', i: '\u0456', s: '\u0455', j: '\u0458',
    A: '\u0410', E: '\u0415', O: '\u041e', P: '\u0420', C: '\u0421', H: '\u041d',
    T: '\u0422', M: '\u041c', B: '\u0412', K: '\u041a', X: '\u0425'
  };
  const noisy = (t) => Array.from(String(t)).map(ch => {
    let o = (HG[ch] && R.chance(0.55)) ? HG[ch] : ch;
    if (R.chance(0.3)) o += R.pick(ZW);
    return o;
  }).join('');

  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const title = (s) => s.replace(/\b\w/g, m => m.toUpperCase());
  const casing = () => R.pick([
    s => s, s => cap(s.toLowerCase()), s => s.toLowerCase(), s => s.toUpperCase(), s => title(s)
  ]);
  const fx = (t) => noisy(casing()(t));

  // Pronounceable random words (gibberish mode + random placeholders)
  const word = (n) => {
    const C = 'bcdfghjklmnprstvwz', V = 'aeiou';
    let s = '';
    for (let i = 0; i < (n || R.int(2, 4)); i++) s += C[R.int(0, C.length - 1)] + V[R.int(0, 4)];
    return s;
  };
  const gib = () => word(R.int(2, 4)) + (R.chance(0.4) ? ' ' + word(R.int(1, 3)) : '');

  const GIB = () => CONFIG.TEXT_MODE === 'gibberish';

  const PRE = ['', '', '', 'Your ', 'Enter ', 'Please enter ', 'Type ', 'Provide ', 'Add ', 'Fill in '];
  const SUF = ['', '', '', ' *', ':', ' (required)', ' here', '…', ' ?', ' -'];
  const FILL = ['type here…', '…', 'enter value', 'required', 'write here', 'tap to edit', 'your answer', '_____'];

  // Dynamic text registry: every entry is regenerated on rotation
  const dynList = [];
  const dyn = (node, prop, gen) => {
    const apply = () => { node[prop] = gen(); };
    apply();
    dynList.push(apply);
  };

  const labelGen = (def) => () => {
    if (GIB()) return gib();
    if (def.labels && (R.chance(0.7) || !def.alt)) {
      return fx(R.pick(PRE) + R.pick(def.labels) + R.pick(SUF));
    }
    return fx(R.pick(def.alt));
  };
  const phGen = (def) => () => {
    if (GIB()) return gib();
    return fx(R.pick([].concat(def.ph, FILL, [word(R.int(3, 8))])));
  };
  const textGen = (pool) => () => GIB() ? gib() : fx(R.pick(pool));

  const ERR = ['Please check this field', 'This value is not valid', 'Needs attention', 'Cannot be empty', 'Look at this again', 'Invalid entry'];

  /* ------------------------------------------------------------------ *
   *  Theme (random per reload)
   * ------------------------------------------------------------------ */
  const hue = R.int(0, 359);
  const dark = R.chance(0.5);
  const T = {
    font: R.pick([
      'Georgia, "Times New Roman", serif',
      '"Trebuchet MS", Verdana, sans-serif',
      '"Segoe UI", Tahoma, sans-serif',
      '"Courier New", monospace',
      'Garamond, "Palatino Linotype", serif',
      'Tahoma, Geneva, sans-serif',
      '"Lucida Console", Monaco, monospace'
    ]),
    size: R.int(13, 16),
    rad: R.int(0, 16),
    pad: R.int(7, 14),
    bw: R.int(1, 2),
    bg:   dark ? `hsl(${hue} 20% 11%)` : `hsl(${hue} 40% 95%)`,
    card: dark ? `hsl(${hue} 18% 17%)` : '#ffffff',
    fg:   dark ? '#eceff4'             : `hsl(${hue} 30% 15%)`,
    bd:   dark ? `hsl(${hue} 15% 32%)` : `hsl(${hue} 20% 78%)`,
    ac:   `hsl(${(hue + R.int(0, 80)) % 360} 70% ${dark ? 58 : 42}%)`
  };

  /* ------------------------------------------------------------------ *
   *  Containers + attribute noise / rotation
   * ------------------------------------------------------------------ */
  const CT = ['div', 'section', 'article', 'span', 'aside', 'figure', 'nav'];
  const LT = ['span', 'div', 'b', 'em', 'i', 'strong'];
  const tracked = [];

  const rattrs = (e) => {
    for (let i = R.int(2, 5); i--;) {
      e.setAttribute('data-' + R.str(R.int(3, 7)), R.str(R.int(4, 10)));
    }
  };
  const el = (doc, tag, cls) => {
    const e = doc.createElement(tag);
    if (cls) e.className = cls;
    rattrs(e);
    return e;
  };
  const scramble = (e) => {
    Array.from(e.attributes).forEach(a => {
      if (a.name.indexOf('data-') === 0) e.removeAttribute(a.name);
    });
    rattrs(e);
    if (e.hasAttribute('id')) e.id = R.str(9);
    if (e.hasAttribute('name') && e.type !== 'radio') e.setAttribute('name', R.str(9));
    if (e.hasAttribute('aria-label')) e.setAttribute('aria-label', noisy(R.str(6)));
  };
  if (CONFIG.ROTATE_MS > 0) {
    setInterval(() => {
      tracked.forEach(scramble);
      dynList.forEach(fn => fn());
    }, CONFIG.ROTATE_MS);
  }

  /* ------------------------------------------------------------------ *
   *  Random class maps + CSS
   * ------------------------------------------------------------------ */
  const cls = () => ({
    w: R.str(7), l: R.str(7), i: R.str(7), o: R.str(7), e: R.str(7),
    k: R.str(7), r: R.str(7), b: R.str(7), out: R.str(7), h: R.str(7)
  });

  // o.row  : label sits beside the control instead of above it
  // o.lo   : label order (0 = before control, 2 = after control)
  const shadowCss = (c, o) => {
    o = o || { row: false, lo: 0 };
    return `
    :host{display:block}
    .${c.w}{display:flex;flex-direction:${o.row ? 'row' : 'column'};flex-wrap:wrap;${o.row ? 'align-items:center;' : ''}gap:6px 12px;padding:${T.pad}px 12px 4px;font:${T.size}px/1.4 ${T.font};color:${T.fg}}
    .${c.l}{order:${o.lo};font-weight:600;font-size:${T.size - 1}px;${o.row ? 'flex:0 0 34%;' : ''}}
    .${c.i}{order:1;box-sizing:border-box;${o.row ? 'flex:1 1 52%;' : 'width:100%;'}padding:${T.pad}px 12px;border:${T.bw}px solid ${T.bd};border-radius:${T.rad}px;background:${T.card};color:${T.fg};font:inherit}
    textarea.${c.i}{min-height:70px;resize:vertical}
    .${c.i}:focus{outline:2px solid ${T.ac};outline-offset:1px}
    .${c.k}{order:1;align-self:flex-start;width:18px;height:18px;accent-color:${T.ac}}
    .${c.o}{order:1;display:flex;flex-wrap:wrap;gap:8px 18px;${o.row ? 'flex:1 1 52%;' : ''}}
    .${c.r}{display:flex;align-items:center;gap:6px;cursor:pointer}
    .${c.e}{order:3;flex:0 0 100%;color:#e5484d;font-size:12px;min-height:14px}
    .${c.h}{font-size:${T.size + 9}px;font-weight:700;margin:0;color:${T.fg}}
    .${c.b}{display:inline-block;align-self:flex-start;padding:${T.pad + 2}px 24px;border-radius:${T.rad}px;background:${T.ac};color:#fff;font-weight:700;cursor:pointer;user-select:none}
    .${c.b}:focus{outline:2px solid ${T.fg};outline-offset:2px}
    .${c.out}{order:3;flex:0 0 100%;box-sizing:border-box;white-space:pre-wrap;font:12px/1.5 "Courier New",monospace;padding:10px;border:1px dashed ${T.bd};border-radius:${T.rad}px;min-height:18px}
  `;
  };

  // Per-document scope: body style + iframe class
  const scope = (doc) => {
    const c = { box: R.str(6), f: R.str(8) };
    const s = doc.createElement('style');
    s.textContent = `
      html,body{margin:0}
      body{background:${T.bg};color:${T.fg};padding:12px;font:${T.size}px ${T.font}}
      .${c.box}{display:flex;flex-direction:column}
      .${c.f}{display:block;width:100%;border:${T.bw}px solid ${T.bd};border-radius:${T.rad}px;background:${T.card};margin:10px 0}
    `;
    (doc.head || doc.documentElement).appendChild(s);
    return c;
  };

  /* ------------------------------------------------------------------ *
   *  Field definitions
   *  labels = noun phrases (get random prefix/suffix)
   *  alt    = complete phrases (used as-is)
   *  opt    = optional: randomly present or absent on each reload
   * ------------------------------------------------------------------ */
  const nonEmpty = (v) => String(v).length > 0;
  const DEFS = [
    { key: 'firstName', kind: 'text', h: 100, types: ['text', 'search'], v: nonEmpty,
      labels: ['first name', 'given name', 'forename', 'personal name', 'name'],
      alt: ['What should we call you?', 'Your first name'],
      ph: ['Alex', 'John', 'Maria', 'Sam', 'Priya'] },
    { key: 'lastName', kind: 'text', h: 100, types: ['text', 'search'], v: nonEmpty, opt: true,
      labels: ['last name', 'family name', 'surname', 'second name'],
      alt: ['And your family name?', 'Your surname'],
      ph: ['Morgan', 'Doe', 'Singh', 'Silva', 'Tanaka'] },
    { key: 'email', kind: 'text', h: 100, types: ['text'], v: (v) => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v),
      labels: ['email address', 'e-mail', 'mail', 'email'],
      alt: ['Where can we reach you?', 'Your inbox address'],
      ph: ['name@example.com', 'you@mail.com', 'someone@domain.org', 'user@site.io'] },
    { key: 'phone', kind: 'text', h: 100, types: ['text', 'search'], v: (v) => v.replace(/\D/g, '').length >= 7, opt: true,
      labels: ['phone number', 'mobile', 'contact number', 'telephone', 'cell'],
      alt: ['Best number to call', 'How do we ring you?'],
      ph: ['+1 555 0100', '555-0100', 'digits only', '0000 000 000'] },
    { key: 'password', kind: 'text', h: 100, types: ['password'], v: (v) => v.length >= 6,
      labels: ['password', 'secret phrase', 'passcode', 'secret'],
      alt: ['Choose something hard to guess', 'Pick a password'],
      ph: ['at least 6 characters', '••••••', 'keep it private', 'min 6'] },
    { key: 'dob', kind: 'text', h: 100, types: ['date'], v: nonEmpty, opt: true,
      labels: ['date of birth', 'birthday', 'birth date', 'dob'],
      alt: ['When were you born?', 'Your birthday'], ph: [''] },
    { key: 'country', kind: 'select', h: 100, v: nonEmpty, opt: true,
      labels: ['country', 'nation', 'region', 'country of residence'],
      alt: ['Where do you live?', 'Home country'],
      options: ['India', 'United States', 'Germany', 'Brazil', 'Japan', 'Canada', 'Australia', 'France', 'Spain', 'Kenya', 'Norway', 'Mexico'] },
    { key: 'gender', kind: 'radio', h: 110, v: nonEmpty, opt: true,
      labels: ['gender', 'identity', 'identify as'],
      alt: ['Pick one that fits', 'How do you identify?'],
      options: ['Female', 'Male', 'Non-binary', 'Prefer not to say', 'Other'] },
    { key: 'message', kind: 'area', h: 155, v: () => true, opt: true,
      labels: ['message', 'notes', 'comments', 'remarks'],
      alt: ['Anything else?', 'Tell us more'],
      ph: ['write something…', 'optional notes', 'say hello', 'your thoughts'] },
    { key: 'terms', kind: 'check', h: 80, v: (v) => v === true,
      alt: ['I accept the terms', 'I agree to the conditions', 'Terms accepted', 'Yes, I agree', 'I have read and accept the rules', 'Count me in on the policy'] },
    { key: 'newsletter', kind: 'check', h: 80, v: () => true, opt: true,
      alt: ['Send me updates', 'Subscribe to the newsletter', 'Keep me posted', 'Yes, email me news', 'I want occasional offers', 'Add me to the mailing list'] }
  ];

  /* ------------------------------------------------------------------ *
   *  Field factory: random custom-element tag + CLOSED shadow root
   * ------------------------------------------------------------------ */
  const registry = [];

  function field(doc, def) {
    const host = doc.createElement('x-' + R.str(R.int(3, 8)));
    rattrs(host);
    tracked.push(host);

    const root = host.attachShadow({ mode: 'closed' });
    const c = cls();
    const lay = { row: R.chance(0.35), lo: R.pick([0, 0, 2]) };
    const st = doc.createElement('style');
    st.textContent = shadowCss(c, lay);
    root.appendChild(st);

    const wrap = el(doc, R.pick(CT), c.w);
    const label = el(doc, R.pick(LT), c.l);
    dyn(label, 'textContent', labelGen(def));
    if (GIB()) wrap.title = def.key;   // hover hint, lives inside the closed shadow
    const err = el(doc, R.pick(['span', 'div', 'small']), c.e);

    let ctrl, get;

    if (def.kind === 'text') {
      ctrl = el(doc, 'input', c.i);
      ctrl.type = R.pick(def.types);
      ctrl.id = R.str(9);
      ctrl.setAttribute('name', R.str(9));
      ctrl.setAttribute('autocomplete', 'x-' + R.str(6));
      if (ctrl.type !== 'date') dyn(ctrl, 'placeholder', phGen(def));
      ctrl.setAttribute('aria-label', noisy(R.str(6)));
      tracked.push(ctrl);
      get = () => ctrl.value.trim();
    } else if (def.kind === 'area') {
      ctrl = el(doc, 'textarea', c.i);
      ctrl.id = R.str(9);
      ctrl.setAttribute('name', R.str(9));
      dyn(ctrl, 'placeholder', phGen(def));
      tracked.push(ctrl);
      get = () => ctrl.value.trim();
    } else if (def.kind === 'select') {
      ctrl = el(doc, 'select', c.i);
      ctrl.id = R.str(9);
      ctrl.setAttribute('name', R.str(9));
      const blank = doc.createElement('option');
      blank.value = '';
      dyn(blank, 'textContent', textGen(['select…', 'choose', 'pick one', '—', 'tap to choose']));
      ctrl.appendChild(blank);
      R.shuffle(def.options).slice(0, R.int(4, def.options.length)).forEach(o => {
        const op = doc.createElement('option');
        op.value = R.str(6);
        op.dataset.t = o;
        dyn(op, 'textContent', () => GIB() ? gib() : noisy(o));
        ctrl.appendChild(op);
      });
      tracked.push(ctrl);
      get = () => ctrl.selectedIndex > 0 ? ctrl.options[ctrl.selectedIndex].dataset.t : '';
    } else if (def.kind === 'radio') {
      ctrl = el(doc, R.pick(CT), c.o);
      const group = R.str(8);
      const inputs = [];
      R.shuffle(def.options).slice(0, R.int(3, def.options.length)).forEach(o => {
        const row = el(doc, R.pick(['div', 'span', 'section']), c.r);
        const inp = doc.createElement('input');
        inp.type = 'radio';
        inp.name = group;               // shared inside the group; rotated as a whole below
        inp.value = R.str(6);
        inp.dataset.t = o;
        const tx = el(doc, R.pick(LT));
        dyn(tx, 'textContent', () => GIB() ? gib() : noisy(o));
        row.appendChild(inp);
        row.appendChild(tx);
        row.addEventListener('click', (ev) => { if (ev.target !== inp) inp.click(); });
        inputs.push(inp);
        ctrl.appendChild(row);
      });
      tracked.push(ctrl);
      get = () => { const x = inputs.find(i => i.checked); return x ? x.dataset.t : ''; };
    } else if (def.kind === 'check') {
      ctrl = doc.createElement('input');
      ctrl.type = 'checkbox';
      ctrl.className = c.k;
      ctrl.id = R.str(9);
      ctrl.setAttribute('name', R.str(9));
      rattrs(ctrl);
      tracked.push(ctrl);
      get = () => ctrl.checked;
    }

    // DOM order is shuffled; visual order is fixed by CSS `order`
    R.shuffle([label, ctrl, err]).forEach(n => wrap.appendChild(n));
    root.appendChild(wrap);

    registry.push({
      def: def,
      get: get,
      err: (m) => { err.textContent = m ? (GIB() ? gib() : fx(R.pick(ERR))) : ''; }
    });
    return host;
  }

  /* ------------------------------------------------------------------ *
   *  Submit button + result panel
   * ------------------------------------------------------------------ */
  function submitHost(doc) {
    const host = doc.createElement('x-' + R.str(R.int(3, 8)));
    rattrs(host);
    tracked.push(host);
    const root = host.attachShadow({ mode: 'closed' });
    const c = cls();
    const st = doc.createElement('style');
    st.textContent = shadowCss(c);
    root.appendChild(st);

    const wrap = el(doc, R.pick(CT), c.w);
    const btn = el(doc, R.pick(['div', 'span', 'section', 'b']), c.b);
    btn.setAttribute('role', 'button');
    btn.setAttribute('tabindex', '0');
    btn.id = R.str(9);
    dyn(btn, 'textContent', textGen([
      'Create account', 'Send details', 'Register now', 'Confirm and continue',
      'Go ahead', 'Finish', 'Sign me up', 'Submit form', 'Done'
    ]));
    tracked.push(btn);
    const out = el(doc, R.pick(CT), c.out);

    const run = () => {
      let ok = true;
      const data = {};
      registry.forEach(r => {
        const v = r.get();
        const good = r.def.v(v);
        r.err(good ? '' : 'x');
        if (!good) ok = false;
        data[r.def.key] = v;
      });
      out.textContent = ok
        ? 'Submitted:\n' + JSON.stringify(data, null, 2)
        : 'Some fields need attention.';
    };
    btn.addEventListener('click', run);
    btn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); run(); } });

    R.shuffle([btn, out]).forEach(n => wrap.appendChild(n));
    root.appendChild(wrap);
    return host;
  }

  /* ------------------------------------------------------------------ *
   *  Heading
   * ------------------------------------------------------------------ */
  function heading(doc) {
    const host = doc.createElement('x-' + R.str(R.int(3, 8)));
    rattrs(host);
    tracked.push(host);
    const root = host.attachShadow({ mode: 'closed' });
    const c = cls();
    const st = doc.createElement('style');
    st.textContent = shadowCss(c);
    root.appendChild(st);
    const wrap = el(doc, R.pick(CT), c.w);
    const h = el(doc, R.pick(['div', 'span', 'section']), c.h);
    dyn(h, 'textContent', textGen([
      'Create your profile', 'Join us today', 'Open an account', 'Tell us about you',
      'Registration', 'Let\u2019s get started', 'New member', 'Your details'
    ]));
    wrap.appendChild(h);
    root.appendChild(wrap);
    return host;
  }

  /* ------------------------------------------------------------------ *
   *  Layout helper: DOM order shuffled, visual order via flex `order`
   * ------------------------------------------------------------------ */
  function place(box, nodes) {
    nodes.forEach((n, i) => { n.style.order = String(i); });
    R.shuffle(nodes).forEach(n => box.appendChild(n));
  }

  /* ------------------------------------------------------------------ *
   *  Iframes: random id / name / title, nested up to 3 levels
   * ------------------------------------------------------------------ */
  const split = (list, depth) => {
    if (depth < 3 && list.length >= 3) {
      const k = Math.ceil(list.length * R.pick([0.4, 0.5, 0.6]));
      return [list.slice(0, k), list.slice(k)];
    }
    return [list, []];
  };
  // Heights depend on the split, so remember each split decision
  const splitCache = new Map();
  const splitOnce = (list, depth) => {
    if (!splitCache.has(list)) splitCache.set(list, split(list, depth));
    return splitCache.get(list);
  };
  const H = (list, depth) => {
    const p = splitOnce(list, depth);
    return 50 + p[0].reduce((s, d) => s + d.h, 0) + (p[1].length ? H(p[1], depth + 1) + 30 : 0);
  };

  function frame(doc, D, list, depth) {
    const parts = splitOnce(list, depth);
    const local = parts[0], nested = parts[1];

    const ifr = doc.createElement('iframe');
    ifr.className = D.f;
    rattrs(ifr);
    ifr.id = R.str(10);
    ifr.setAttribute('name', R.str(10));
    dyn(ifr, 'title', textGen(['section', 'details', 'info panel', 'form part', 'block', 'group']));
    ifr.setAttribute('aria-label', noisy(R.str(6)));
    ifr.style.height = H(list, depth) + 'px';
    tracked.push(ifr);

    ifr.addEventListener('load', function () {
      if (ifr._built) return;
      ifr._built = true;
      const d = ifr.contentDocument;
      const D2 = scope(d);
      const box = el(d, R.pick(CT), D2.box);
      d.body.appendChild(box);
      const items = local.map(def => field(d, def));
      if (nested.length) items.push(frame(d, D2, nested, depth + 1));
      place(box, R.shuffle(items));
    });
    ifr.srcdoc = '<!doctype html><html><head><meta charset="utf-8"></head><body></body></html>';
    return ifr;
  }

  /* ------------------------------------------------------------------ *
   *  Build the page
   * ------------------------------------------------------------------ */
  const setTitle = () => { document.title = fx(R.pick(['Sign up', 'Welcome', 'Register', 'Get started', 'Profile setup', 'Join'])) + ' ' + R.str(4); };
  setTitle();
  dynList.push(setTitle);
  document.documentElement.setAttribute('lang', R.pick(['en', 'en-US', 'en-GB', 'en-IN']));

  const D = scope(document);
  const box = el(document, R.pick(CT), D.box);
  box.style.maxWidth = R.int(520, 760) + 'px';
  box.style.margin = '0 auto';
  document.body.appendChild(box);

  // Required fields always exist; optional ones appear randomly
  const defs = R.shuffle(DEFS.filter(d => !d.opt || R.chance(0.65)));
  const mainDefs = defs.slice(0, R.int(2, 3));
  const rest = defs.slice(mainDefs.length);
  const nFrames = R.int(2, 3);

  const items = mainDefs.map(d => field(document, d));
  for (let i = 0; i < nFrames; i++) {
